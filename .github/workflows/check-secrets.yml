# Check the macOS signing secrets that release.yml uses, without building anything: Actions > check-secrets > Run workflow.
# Imports the Developer ID certificate into a temporary keychain, signs a test file with it, and asks Apple's notary service
# for the team's submission history with the API key (this authenticates; it submits nothing).
name: check-secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Which secrets are set
        env:
          S1: ${{ secrets.MACOS_CERT_P12 != '' }}
          S2: ${{ secrets.MACOS_CERT_PASSWORD != '' }}
          S3: ${{ secrets.NOTARY_KEY_P8 != '' }}
          S4: ${{ secrets.NOTARY_KEY_ID != '' }}
          S5: ${{ secrets.NOTARY_ISSUER != '' }}
        run: |
          echo "MACOS_CERT_P12=$S1 MACOS_CERT_PASSWORD=$S2 NOTARY_KEY_P8=$S3 NOTARY_KEY_ID=$S4 NOTARY_ISSUER=$S5"
          [ "$S1$S2$S3$S4$S5" = truetruetruetruetrue ] || { echo "::error::a secret is missing"; exit 1; }

      - name: Certificate imports, and signs
        env:
          CERT: ${{ secrets.MACOS_CERT_P12 }}
          PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          kc=$RUNNER_TEMP/check.keychain-db
          pw=$(uuidgen)
          security create-keychain -p "$pw" "$kc"
          security unlock-keychain -p "$pw" "$kc"
          echo "$CERT" | base64 -D > "$RUNNER_TEMP/cert.p12" || { echo "::error::MACOS_CERT_P12 is not base64"; exit 1; }
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$PASSWORD" -T /usr/bin/codesign \
            || { echo "::error::the .p12 does not import: wrong password, or not a .p12"; exit 1; }
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$kc" | tee ids.txt
          id=$(sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' ids.txt | head -1)
          [ -n "$id" ] || { echo "::error::no valid Developer ID Application identity (missing private key, or the Apple intermediate certificate)"; exit 1; }
          cp /bin/echo "$RUNNER_TEMP/t" && codesign --force --timestamp --options runtime -s "$id" "$RUNNER_TEMP/t"
          codesign --verify --verbose=2 "$RUNNER_TEMP/t"
          echo "signed as: $id"

      - name: Notary key authenticates
        env:
          KEY: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          echo "$KEY" | base64 -D > "$RUNNER_TEMP/AuthKey.p8" || { echo "::error::NOTARY_KEY_P8 is not base64"; exit 1; }
          trap 'rm -f "$RUNNER_TEMP/AuthKey.p8"' EXIT
          head -1 "$RUNNER_TEMP/AuthKey.p8" | grep -q "BEGIN PRIVATE KEY" || { echo "::error::NOTARY_KEY_P8 does not decode to a .p8 key"; exit 1; }
          xcrun notarytool history --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" \
            || { echo "::error::Apple refused the key, key ID or issuer"; exit 1; }
