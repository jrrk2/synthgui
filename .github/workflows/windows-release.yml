# Windows build of synthgui and the tools it runs, from source on GitHub-hosted runners, attached to a draft release when
# a v*-windows tag is pushed.
#
#   Run by hand (Actions > Windows release > Run workflow): the zip is kept as the run's artifact "synthgui-windows".
#   git tag v0.1.2-windows && git push origin v0.1.2-windows: the same, plus a draft release with the zip, to check
#   and publish by hand.
#
# The zip is unsigned: it is signed by hand afterwards (RELEASE-WINDOWS.md, Signing), as a Certum certificate's key
# stays in Certum's cloud and cannot be used from a runner.
#
# Nothing built is cached between runs: every binary in the zip comes from this run (scripts/build-deps.sh,
# scripts/package-windows.sh). The MSYS2 packages are MSYS2's own builds.
name: Windows release

on:
  workflow_dispatch:
  workflow_call:            # the release workflow (release.yml) runs this for its Windows zip
  push:
    tags: ['v*-windows']

permissions:
  contents: read

env:
  MSYS2_PACKAGES: >-
    make autoconf automake libtool bison flex help2man git patch gperf zip bzip2
    mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja mingw-w64-x86_64-pkgconf
    mingw-w64-x86_64-boost mingw-w64-x86_64-eigen3 mingw-w64-x86_64-tcl mingw-w64-x86_64-swig mingw-w64-x86_64-zlib
    mingw-w64-x86_64-python mingw-w64-x86_64-readline mingw-w64-x86_64-dlfcn mingw-w64-x86_64-z3
    mingw-w64-x86_64-qt6-base mingw-w64-x86_64-qt6-tools

jobs:
  # CUDD, prjxray's xc7frames2bit, fasm2netlist, OpenSTA, openFPGALoader (with libusb, hidapi and libftdi)
  tools:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - run: git config --global core.autocrlf false   # CRLF breaks the autotools and generator scripts
      - uses: actions/checkout@v4
      - run: git submodule update --init --depth 1 deps/cudd deps/OpenSTA deps/fasm2netlist deps/openFPGALoader deps/prjxray
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
      - name: Install MSYS2 packages
        shell: msys2 {0}
        run: |   # a mirror that stalls fails the whole transaction: try again
          for i in 1 2 3; do pacman -S --needed --noconfirm $MSYS2_PACKAGES && exit 0; sleep 30; done; exit 1
      - shell: msys2 {0}
        run: scripts/build-deps.sh cudd prjxray fasm2netlist sta ofl
      - uses: actions/upload-artifact@v4
        with:
          name: tools
          if-no-files-found: error
          path: |
            build-deps/prefix/bin/sta.exe
            build-deps/prefix/bin/openFPGALoader.exe
            build-deps/prefix/share/openFPGALoader
            build-deps/fasm2netlist/tileverilog.exe
            build-deps/fasm2netlist/lvs_equiv.exe
            build-deps/prjxray/tools/xc7frames2bit.exe

  # Verilator with ABC (the synthesis fork)
  verilator:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - run: git submodule update --init --depth 1 deps/verilator
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
      - name: Install MSYS2 packages
        shell: msys2 {0}
        run: |   # a mirror that stalls fails the whole transaction: try again
          for i in 1 2 3; do pacman -S --needed --noconfirm $MSYS2_PACKAGES && exit 0; sleep 30; done; exit 1
      - shell: msys2 {0}
        run: scripts/build-deps.sh verilator
      - uses: actions/upload-artifact@v4
        with:
          name: verilator
          if-no-files-found: error
          path: |
            build-deps/prefix/bin/verilator_bin.exe
            build-deps/prefix/share/verilator

  # nextpnr-himbaechel and the xc7a50t and xc7vx485t chip databases, generated from prjxray-db here
  nextpnr:
    runs-on: windows-latest
    timeout-minutes: 330
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - run: git submodule update --init --depth 1 deps/nextpnr deps/prjxray-db
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
      - name: Install MSYS2 packages
        shell: msys2 {0}
        run: |   # a mirror that stalls fails the whole transaction: try again
          for i in 1 2 3; do pacman -S --needed --noconfirm $MSYS2_PACKAGES && exit 0; sleep 30; done; exit 1
      - shell: msys2 {0}
        run: scripts/build-deps.sh nextpnr
      - uses: actions/upload-artifact@v4
        with:
          name: nextpnr
          if-no-files-found: error
          path: |
            build-deps/nextpnr/nextpnr-himbaechel.exe
            build-deps/nextpnr/share/himbaechel/xilinx/chipdb-*.bin

  # synthgui itself, the package, signing, the zip and (for a tag) the draft release
  package:
    needs: [tools, verilator, nextpnr]
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write         # the draft release
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - run: git submodule update --init --depth 1 deps/prjxray-db
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
      - name: Install MSYS2 packages
        shell: msys2 {0}
        run: |   # a mirror that stalls fails the whole transaction: try again
          for i in 1 2 3; do pacman -S --needed --noconfirm $MSYS2_PACKAGES && exit 0; sleep 30; done; exit 1
      # each artifact unpacks below the directory its files have in common
      - uses: actions/download-artifact@v4
        with: { name: tools, path: build-deps }
      - uses: actions/download-artifact@v4
        with: { name: verilator, path: build-deps/prefix }
      - uses: actions/download-artifact@v4
        with: { name: nextpnr, path: build-deps/nextpnr }
      - id: version
        shell: msys2 {0}
        run: echo "version=$(sed -n 's/^set(SYNTHGUI_VERSION "\([^"]*\)".*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"
      - shell: msys2 {0}
        run: scripts/package-windows.sh

      - name: Zip
        id: zip
        shell: msys2 {0}
        run: |
          name=synthgui-${{ steps.version.outputs.version }}-windows-x64
          rm -f build-release/$name.zip
          (cd build-release && zip -qr -9 "$OLDPWD/build-release/$name.zip" $name)
          echo "zip=build-release/$name.zip" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum build-release/$name.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: synthgui-windows
          path: ${{ steps.zip.outputs.zip }}
          compression-level: 0

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          synthgui for Windows, version ${{ steps.version.outputs.version }}. Draft: edit these notes before publishing
          (the v0.1.1-windows release notes are the model).

          Built by ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} from commit ${{ github.sha }}.
          Not signed: this is the unsigned build.

          SHA-256: \`${{ steps.zip.outputs.sha256 }}\`
          EOF
          gh release create "${{ github.ref_name }}" "${{ steps.zip.outputs.zip }}" --draft \
            --title "synthgui ${{ steps.version.outputs.version }} for Windows" --notes-file notes.md
